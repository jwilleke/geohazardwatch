name: Publish container image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Override tag (default: derived from package.json)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/geohazardwatch

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js for addon publish
        uses: actions/setup-node@v7
        with:
          node-version: '24.20.0'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@jwilleke'

      - name: Publish @jwilleke/geohazardwatch-addon
        working-directory: addons/geohazardwatch
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve addon version for image build
        id: addon_version
        run: echo "version=$(node -p "require('./addons/geohazardwatch/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=geohazardwatch
            org.opencontainers.image.description=Volcano and geology platform built on ngdpbase with the geohazardwatch addon
            org.opencontainers.image.vendor=jwilleke

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GEOHAZARDWATCH_ADDON_VERSION=${{ steps.addon_version.outputs.version }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ngdpbase #1087 (shipped in v4.12.0) makes a headless install REFUSE to
      # create the bootstrap admin on the shipped password. The old smoke test
      # booted exactly that container and asserted it came up, so it has failed
      # on every release since the base was bumped to v4.12.0 (v1.2.193). Two
      # halves now, mirroring ngdpbase's own docker-build.yml: the refusal must
      # propagate into this image, and a configured install must come up.
      # Tracked in ngdpbase#1195.
      - name: Smoke test — an unconfigured headless install must REFUSE to boot
        run: |
          docker rm -f ghw-smoke-refuse 2>/dev/null || true
          docker run -d --name ghw-smoke-refuse \
            -e HEADLESS_INSTALL=true \
            -e NODE_ENV=production \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

          for i in $(seq 1 12); do
            RUNNING=$(docker inspect --format='{{.State.Running}}' ghw-smoke-refuse 2>/dev/null || echo "false")
            [ "$RUNNING" = "false" ] && break
            echo "  attempt $i/12: still running"
            sleep 5
          done

          if [ "$(docker inspect --format='{{.State.Running}}' ghw-smoke-refuse 2>/dev/null)" = "true" ]; then
            echo "FAILED: a headless install with no admin password came up. ngdpbase#1087's"
            echo "        guard is not working in this image — it would create admin/admin123."
            docker logs ghw-smoke-refuse
            docker rm -f ghw-smoke-refuse 2>/dev/null || true
            exit 1
          fi

          if ! docker logs ghw-smoke-refuse 2>&1 | grep -q "Refusing to create the bootstrap admin account"; then
            echo "FAILED: the container stopped, but not for #1087's reason."
            docker logs ghw-smoke-refuse
            docker rm -f ghw-smoke-refuse 2>/dev/null || true
            exit 1
          fi

          echo "Refused to bootstrap on the shipped password, as ngdpbase#1087 requires."
          docker rm -f ghw-smoke-refuse 2>/dev/null || true

      - name: Smoke test — start a CONFIGURED container
        run: |
          # The config file is required: #1087's guard compares the RESOLVED
          # password rather than reading the variable, so exporting
          # NGDPBASE_ADMIN_PASSWORD alone still resolves to the shipped default.
          mkdir -p "$RUNNER_TEMP/smoke-data/config"
          cat > "$RUNNER_TEMP/smoke-data/config/app-custom-config.json" <<'JSON'
          {
            "ngdpbase.user.security.defaultpassword": "$NGDPBASE_ADMIN_PASSWORD"
          }
          JSON

          docker run -d --name ghw-smoke \
            -p 3000:3000 \
            -e HEADLESS_INSTALL=true \
            -e NODE_ENV=production \
            -e NGDPBASE_ADMIN_PASSWORD="ci-smoke-$(openssl rand -hex 12)" \
            -v "$RUNNER_TEMP/smoke-data:/app/data" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Smoke test — wait for healthy
        run: |
          for i in $(seq 1 18); do
            STATUS=$(docker inspect --format='{{.State.Health.Status}}' ghw-smoke 2>/dev/null || echo starting)
            echo "  attempt $i/18: $STATUS"
            if [ "$STATUS" = "healthy" ]; then exit 0; fi
            if [ "$STATUS" = "unhealthy" ]; then docker logs ghw-smoke; exit 1; fi
            sleep 5
          done
          echo "Timed out waiting for healthy"
          docker logs ghw-smoke
          exit 1

      - name: Smoke test — HTTP probe
        run: |
          BASE=http://localhost:3000
          code=$(curl -s -o /dev/null -w "%{http_code}" "$BASE/")
          echo "GET / -> HTTP $code"
          case "$code" in
            2*|3*) ;;
            *) docker logs ghw-smoke; exit 1 ;;
          esac

      - name: Smoke test — dump logs on failure
        if: failure()
        run: docker logs ghw-smoke 2>&1 || true

      - name: Smoke test — cleanup
        if: always()
        run: docker rm -f ghw-smoke ghw-smoke-refuse 2>/dev/null || true

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Image digest
        run: echo "Image digest ${{ steps.build.outputs.digest }}"
